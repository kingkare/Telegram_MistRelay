services:
  mistrelay:
    build: 
      context: .
      # 如果构建时遇到DNS问题，可以在构建时设置DNS
      # 注意：build阶段的DNS需要在Docker daemon级别配置，或使用build args
    container_name: mistrelay
    # Keep disabled during credential rotation; enable a restart policy only after activation tests pass.
    restart: "no"
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    volumes:
      - type: bind
        source: ./db
        target: /app/db
        bind:
          create_host_path: false
      - type: bind
        source: ./downloads
        target: /data/downloads
        bind:
          create_host_path: false
      - type: bind
        source: ./cache/thumbnails
        target: /app/cache/thumbnails
        bind:
          create_host_path: false
      - type: bind
        source: ./web/dist
        target: /app/web/dist
        bind:
          create_host_path: false
      - type: bind
        source: ./vps_deployer.py
        target: /app/vps_deployer.py
        bind:
          create_host_path: false
      - type: bind
        source: ./edge_node_manager.py
        target: /app/edge_node_manager.py
        bind:
          create_host_path: false
      - type: bind
        source: ./edge_worker
        target: /app/edge_worker
        bind:
          create_host_path: false
      - type: bind
        source: ./WebStreamer
        target: /app/WebStreamer
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777,size=64m
      - /run:rw,noexec,nosuid,nodev,mode=0755,size=16m
      - /app/aria2:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700,size=16m
    environment:
      - TZ=Asia/Shanghai
      - PYTHONDONTWRITEBYTECODE=1
      - HOME=/home/mistrelay
      - XDG_CACHE_HOME=/tmp/.cache
      - MISTRELAY_FILE_ROOT=/data/downloads
      - MISTRELAY_CONTAINER_NAME=mistrelay
      - MISTRELAY_SESSION_DIR=/app/db/sessions
      - MISTRELAY_ADMIN_PASSWORD_FILE=/app/db/admin-password
      - MISTRELAY_LOG_RETENTION_DAYS=90
      - MISTRELAY_TRUSTED_PROXY_CIDRS=172.25.0.1/32
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 7s
      retries: 3
      start_period: 60s
    cpus: 2.0
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "10"
    stop_grace_period: 20s

networks:
  default:
    ipam:
      config:
        - subnet: 172.25.0.0/16
          gateway: 172.25.0.1
